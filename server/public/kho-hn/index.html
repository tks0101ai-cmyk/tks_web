<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kho Hà Nội · TOKOSI Dashboard</title>
  <link rel="icon" type="image/jpeg" href="/Logo.jpg">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('tks-dashboard-theme') === 'light' ? 'light' : 'dark'; }
    catch (error) { document.documentElement.dataset.theme = 'dark'; }
    document.documentElement.style.visibility = 'hidden';
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/shared/shared.css?v=20261107-3">
  <script src="/shared/motion.js?v=20261024-1" defer></script>
  <link rel="stylesheet" href="/kho/kho.css?v=20261105-3">
</head>
<body>
  <div class="receipt-header">
    <div class="brand">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="brand-mark"><img src="/Logo.jpg" alt="TOKOSI Logo" width="44" height="44"></div>
      <div class="brand-text"><h1>Tổng kho gia dụng Tokosi</h1></div>
    </div>
    <div class="status-line">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Chuyển chế độ giao diện">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"></path></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        <span id="themeLabel">Light mode</span>
      </button>
      <div class="account-chip" id="accountChip"></div>
    </div>
  </div>
  <div class="shell">
    <div class="backdrop" id="backdrop"></div>
    <div class="sidebar" id="sidebar" data-tks-active-top="stockLocations"></div>
    <main class="content">
      <h2 class="kho-title">Kho Hà Nội</h2>
      <p class="kho-sub">Sơ đồ tổng thể và sơ đồ chi tiết từng khu. Bấm vào ảnh để phóng to, Esc để đóng.</p>
      <nav class="kho-chips" aria-label="Chọn khu kho">
        <a class="kho-chip" href="#kho-A" data-kho-chip="kho-A">A</a>
        <a class="kho-chip" href="#kho-B" data-kho-chip="kho-B">B</a>
        <a class="kho-chip" href="#kho-B-san-truoc" data-kho-chip="kho-B-san-truoc">B-Sân trước</a>
        <a class="kho-chip" href="#kho-C" data-kho-chip="kho-C">C</a>
        <a class="kho-chip" href="#kho-F" data-kho-chip="kho-F">F</a>
        <a class="kho-chip" href="#kho-K" data-kho-chip="kho-K">K</a>
        <a class="kho-chip" href="#kho-P1" data-kho-chip="kho-P1">P1</a>
        <a class="kho-chip" href="#kho-P2" data-kho-chip="kho-P2">P2</a>
        <a class="kho-chip" href="#kho-V" data-kho-chip="kho-V">V</a>
      </nav>
      <div class="kho-list">
        <figure class="kho-figure" id="kho-tong-the">
          <figcaption>Sơ đồ tổng thể</figcaption>
          <img src="/kho-hn/img/00-tong-the.jpg" alt="Sơ đồ tổng thể" data-kho-img tabindex="0">
        </figure>
        <figure class="kho-figure" id="kho-A">
          <figcaption>Kho chính to – A</figcaption>
          <img src="/kho-hn/img/01-A-kho-chinh-to.jpg?v=20261106" alt="Kho chính to – A" data-kho-img tabindex="0">
        </figure>
        <figure class="kho-figure" id="kho-B">
          <figcaption>Kho chính nhỏ – B</figcaption>
          <img src="/kho-hn/img/02-B-kho-chinh-nho.jpg" alt="Kho chính nhỏ – B" data-kho-img tabindex="0">
        </figure>
        <figure class="kho-figure" id="kho-B-san-truoc">
          <figcaption>Sân trước – B</figcaption>
          <img src="/kho-hn/img/03-B-san-truoc.jpg?v=20261106" alt="Sân trước – B" data-kho-img tabindex="0">
        </figure>
        <figure class="kho-figure" id="kho-C">
          <figcaption>Sân sau chính – C</figcaption>
          <img src="/kho-hn/img/04-C-san-sau.jpg" alt="Sân sau chính – C" data-kho-img tabindex="0">
        </figure>
        <figure class="kho-figure" id="kho-F">
          <figcaption>Sân tôn mát – F</figcaption>
          <img src="/kho-hn/img/05-F-san-ton-mat.jpg" alt="Sân tôn mát – F" data-kho-img tabindex="0">
        </figure>
        <figure class="kho-figure" id="kho-K">
          <figcaption>Kho dừa – K</figcaption>
          <img src="/kho-hn/img/06-K-kho-dua.jpg" alt="Kho dừa – K" data-kho-img tabindex="0">
        </figure>
        <figure class="kho-figure" id="kho-P1">
          <figcaption>Kho 8 trước – P1</figcaption>
          <img src="/kho-hn/img/07-P1-kho-8-truoc.jpg" alt="Kho 8 trước – P1" data-kho-img tabindex="0">
        </figure>
        <figure class="kho-figure" id="kho-P2">
          <figcaption>Kho 8 sau – P2</figcaption>
          <img src="/kho-hn/img/08-P2-kho-8-sau.jpg" alt="Kho 8 sau – P2" data-kho-img tabindex="0">
        </figure>
        <figure class="kho-figure" id="kho-V">
          <figcaption>Kho Vin – V</figcaption>
          <img src="/kho-hn/img/09-V-kho-vin.jpg" alt="Kho Vin – V" data-kho-img tabindex="0">
        </figure>
      </div>
      <div class="kho-zoom" id="khoZoom" role="dialog" aria-modal="true" aria-label="Ảnh phóng to" hidden>
        <button class="kho-zoom-close" type="button" data-kho-close aria-label="Đóng">×</button>
        <button class="kho-zoom-nav kho-zoom-prev" type="button" data-kho-prev aria-label="Ảnh trước">‹</button>
        <img alt="">
        <button class="kho-zoom-nav kho-zoom-next" type="button" data-kho-next aria-label="Ảnh sau">›</button>
        <div class="kho-zoom-caption" id="khoZoomCaption" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <script src="/shared/shared-nav.js?v=20261105-kho"></script>
  <script src="/kho/kho.js?v=20261105-3"></script>
  <script>window.addEventListener('DOMContentLoaded', function () { TKSKho.init(); });</script>
  <script src="/shared/shooting-star.js?v=20261019"></script>
</body>
</html>
