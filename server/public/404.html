<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Không tìm thấy trang · TOKOSI</title>
<meta name="description" content="Trang bạn đang tìm không tồn tại hoặc đã bị di chuyển.">
<link rel="icon" type="image/jpeg" href="/Logo.jpg">
<!-- Chống nhấp nháy giao diện khi tải trang — phải chạy trước khi CSS render -->
<script>
  (function(){
    try{ document.documentElement.dataset.theme = localStorage.getItem('tks-dashboard-theme') === 'light' ? 'light' : 'dark'; }
    catch(e){ document.documentElement.dataset.theme = 'dark'; }
    document.documentElement.style.visibility = 'hidden';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/shared/shared.css?v=20261107-3">
<script src="/shared/motion.js?v=20261111-fast-1" defer></script>
<style>
  /* ── Bố cục trang 404 ── */
  .page-404 {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* ── Hiệu ứng bầu trời sao Canvas ── */
  #starCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Vùng sáng mờ Ambient blobs ── */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
    animation: blobDrift 12s ease-in-out infinite alternate;
  }
  .blob-1 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(59,130,246,0.28) 0%, transparent 70%);
    top: -120px; left: -80px;
    animation-delay: 0s;
  }
  .blob-2 {
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(139,92,246,0.2) 0%, transparent 70%);
    bottom: -80px; right: -60px;
    animation-delay: -6s;
  }
  :root[data-theme="light"] .blob-1 {
    background: radial-gradient(circle, rgba(37,99,235,0.12) 0%, transparent 70%);
  }
  :root[data-theme="light"] .blob-2 {
    background: radial-gradient(circle, rgba(109,40,217,0.1) 0%, transparent 70%);
  }
  @keyframes blobDrift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(30px, 20px) scale(1.08); }
  }

  /* ── Khối thẻ Card ── */
  .card-404 {
    position: relative;
    z-index: 1;
    max-width: 480px;
    width: 100%;
    background: var(--glass-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px 40px;
    box-shadow:
      var(--card-shadow),
      0 0 60px -20px rgba(59,130,246,0.18);
    animation: cardIn .55s cubic-bezier(0.23,1,0.32,1) both;
  }
  :root[data-theme="light"] .card-404 {
    box-shadow: var(--card-shadow), 0 0 60px -20px rgba(37,99,235,0.10);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Số lỗi 404 lớn ── */
  .err-code {
    font-family: var(--font-display);
    font-size: clamp(72px, 18vw, 110px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 60%, #3B82F6 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease infinite;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 32px rgba(59,130,246,0.35));
  }
  :root[data-theme="light"] .err-code {
    background: linear-gradient(135deg, #2563EB 0%, #7C3AED 60%, #2563EB 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 16px rgba(37,99,235,0.2));
    animation: gradientShift 4s ease infinite;
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ── Biểu tượng Icon ── */
  .err-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: rgba(59,130,246,0.12);
    border: 1px solid rgba(59,130,246,0.25);
    color: var(--blue);
    animation: iconFloat 3s ease-in-out infinite;
  }
  :root[data-theme="light"] .err-icon {
    background: rgba(37,99,235,0.08);
    border-color: rgba(37,99,235,0.2);
  }
  .err-icon svg { width: 28px; height: 28px; }
  @keyframes iconFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-6px); }
  }

  /* ── Văn bản Text ── */
  .err-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  .err-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 32px;
  }

  /* ── Đường phân cách ── */
  .err-divider {
    width: 48px; height: 3px;
    border-radius: 9999px;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    margin: 0 auto 28px;
    opacity: 0.6;
  }

  /* ── Các nút hành động ── */
  .err-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .err-actions a { text-decoration: none; }

  /* ── Đường dẫn URL gợi ý ── */
  .err-path {
    margin-top: 28px;
    padding: 10px 16px;
    background: var(--glass-panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--font-data);
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
    animation: cardIn .7s .15s cubic-bezier(0.23,1,0.32,1) both;
  }
  .err-path .err-status { color: var(--red); font-weight: 700; }

  /* ── Logo ── */
  .logo-bar {
    position: fixed;
    top: 20px; left: 24px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: cardIn .4s cubic-bezier(0.23,1,0.32,1) both;
  }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: var(--shadow-brand);
    border: 1px solid rgba(255,255,255,0.15);
  }
  :root[data-theme="light"] .logo-mark { border-color: #E2E8F0; }
  .logo-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .logo-name {
    font-family: var(--font-display);
    font-weight: 700; font-size: 15px;
    color: var(--canvas-text);
  }
</style>
</head>
<body>
  <!-- Logo -->
  <div class="logo-bar">
    <div class="logo-mark">
      <img src="/Logo.jpg" alt="TOKOSI Logo" width="36" height="36">
    </div>
    <span class="logo-name">TOKOSI</span>
  </div>

  <!-- Nút chuyển đổi Theme (dùng lại .theme-toggle-floating từ shared.css) -->
  <button id="themeToggleBtn" class="theme-toggle-floating" type="button"
          onclick="toggleTheme()" aria-label="Chuyển chế độ giao diện">
    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
    </svg>
    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
    </svg>
    <span id="themeLabel">Light mode</span>
  </button>

  <!-- Vùng sáng mờ xung quanh -->
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>

  <!-- Bầu trời sao -->
  <canvas id="starCanvas" aria-hidden="true"></canvas>

  <!-- Nội dung chính -->
  <main class="page-404" role="main">
    <div class="card-404">
      <!-- Biểu tượng nổi -->
      <div class="err-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>

      <!-- Số lỗi lớn -->
      <span class="err-code" aria-label="Lỗi 404">404</span>

      <div class="err-divider" aria-hidden="true"></div>

      <h1 class="err-title">Không tìm thấy trang</h1>
      <p class="err-desc">
        Trang bạn đang tìm kiếm không tồn tại, đã bị di chuyển,<br>
        hoặc bạn chưa có quyền truy cập vào địa chỉ này.
      </p>

      <!-- Các nút hành động -->
      <div class="err-actions">
        <a href="/" class="btn-primary" id="btn404Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               style="width:16px;height:16px;" aria-hidden="true">
            <path d="M3 12L12 3l9 9"></path>
            <path d="M9 21V12h6v9"></path>
          </svg>
          Về trang chủ
        </a>
        <button type="button" class="btn-secondary" id="btn404Back"
                onclick="history.length > 1 ? history.back() : (location.href='/')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               style="width:16px;height:16px;" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="M12 5l-7 7 7 7"></path>
          </svg>
          Quay lại
        </button>
      </div>

      <!-- Gợi ý URL hiện tại -->
      <div class="err-path" aria-label="Địa chỉ không tồn tại">
        <span class="err-status">404</span> &mdash; <span id="errUrl"></span>
      </div>
    </div>
  </main>

  <script>
    /* ── Giao diện Theme ── */
    const THEME_KEY = 'tks-dashboard-theme';

    function syncThemeLabel() {
      const isLight = document.documentElement.dataset.theme === 'light';
      const label = document.getElementById('themeLabel');
      if (label) label.textContent = isLight ? 'Dark mode' : 'Light mode';
    }

    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
      syncThemeLabel();
    }

    syncThemeLabel();

    /* ── Hiển thị đường dẫn hiện tại ── */
    (function () {
      const el = document.getElementById('errUrl');
      if (el) el.textContent = location.pathname + location.search;
    })();

    /* ── Canvas bầu trời sao ── */
    (function () {
      const canvas = document.getElementById('starCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let stars = [];
      const N = 120;
      let raf;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function initStars() {
        stars = [];
        for (let i = 0; i < N; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.4 + 0.3,
            a: Math.random(),
            da: (Math.random() * 0.4 + 0.2) * (Math.random() < 0.5 ? 1 : -1) * 0.008
          });
        }
      }

      function drawFrame() {
        const isLight = document.documentElement.dataset.theme === 'light';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          s.a += s.da;
          if (s.a <= 0 || s.a >= 1) s.da *= -1;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = isLight
            ? `rgba(37,99,235,${s.a * 0.22})`
            : `rgba(255,255,255,${s.a * 0.5})`;
          ctx.fill();
        });
        raf = requestAnimationFrame(drawFrame);
      }

      window.addEventListener('resize', () => { resize(); initStars(); });
      resize();
      initStars();
      drawFrame();
    })();

    /* ── Hiển thị trang sau khi áp dụng theme ── */
    document.documentElement.style.visibility = '';
  </script>
  <script src="/shared/shooting-star.js?v=20261019"></script>
</body>
</html>
