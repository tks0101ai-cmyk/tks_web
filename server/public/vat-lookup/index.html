<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu VAT · TOKOSI Dashboard</title>
  <link rel="icon" type="image/jpeg" href="/Logo.jpg">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('tks-dashboard-theme') === 'light' ? 'light' : 'dark'; }
    catch (error) { document.documentElement.dataset.theme = 'dark'; }
    document.documentElement.style.visibility = 'hidden';
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/shared/shared.css?v=20261028-leave-btn">
  <script src="/shared/motion.js?v=20261024-1" defer></script>
  <link rel="stylesheet" href="/shared/table-controls.css?v=20261016-1">
  <link rel="stylesheet" href="/vat-lookup/vat-lookup.css?v=20261024-2">
</head>
<body>
  <div class="receipt-header">
    <div class="brand">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="brand-mark"><img src="/Logo.jpg" alt="TOKOSI Logo" width="44" height="44"></div>
      <div class="brand-text"><h1>Tổng kho gia dụng Tokosi</h1></div>
    </div>
    <div class="status-line">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Chuyển chế độ giao diện">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"></path></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        <span id="themeLabel">Light mode</span>
      </button>
      <div class="account-chip" id="accountChip"></div>
    </div>
  </div>
  <div class="shell">
    <div class="backdrop" id="backdrop"></div>
    <div class="sidebar" id="sidebar" data-tks-active-top="accounting"></div>
    <main class="content vl-page">
      <div class="vl-head">
        <div>
          <h2 class="vl-title">Kế toán – Tra cứu VAT</h2>
          <p class="vl-sub">Xem tồn VAT (sheet Gộp VAT) và hàng sắp về (DK về 2, trạng thái 1–3) trước khi tạo ORDER VAT.</p>
        </div>
      </div>

      <nav class="acct-subnav subnav-tabs" id="vlTabs" aria-label="Chức năng Kế toán"></nav>

      <section class="vl-panel" aria-label="Tra cứu VAT">
        <div class="vl-toolbar">
          <div class="vl-tabbar">
            <div class="vl-tabs" role="tablist" aria-label="Chế độ tra cứu">
              <button class="vl-tab" id="vlTabVat" role="tab" type="button" data-mode="vat" aria-selected="true" aria-controls="vlResults">Hàng VAT có sẵn <span class="vl-count" id="vlCountVat"></span></button>
              <button class="vl-tab" id="vlTabIncoming" role="tab" type="button" data-mode="incoming" aria-selected="false" aria-controls="vlResults">Hàng sắp về <span class="vl-count" id="vlCountIncoming"></span></button>
            </div>
            <!-- table-controls.js tự gắn icon + chữ "Cột hiển thị" (bảng trỏ tới qua data-columns-button); ẩn khi chưa có bảng. -->
            <button id="vlColumns" aria-label="Cột hiển thị" hidden></button>
          </div>
          <form class="vl-search" id="vlForm">
            <label class="vl-search-label" for="vlQuery">Mã Kiot hoặc tên Kiot</label>
            <div class="vl-search-row">
              <textarea id="vlQuery" rows="1" placeholder="Nhập một sản phẩm, hoặc dán danh sách — mỗi dòng một sản phẩm…"
                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-describedby="vlHint"></textarea>
              <button class="btn-primary vl-submit" id="vlSubmit" type="submit">Tìm tất cả</button>
            </div>
            <p class="vl-hint" id="vlHint">Mỗi dòng là một mã hoặc tên; dán thẳng một cột từ Excel (tối đa 100 dòng). <kbd>Enter</kbd> để tìm · <kbd>Ctrl</kbd> + <kbd>Enter</kbd> để xuống dòng.</p>
          </form>
        </div>
        <div class="vl-results" id="vlResults" role="tabpanel" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="/shared/table-controls.js?v=20261030-1"></script>
  <script src="/shared/shared-nav.js?v=20261028-leave-btn"></script>
  <script src="/vat-lookup/vat-lookup.js?v=20261023-5"></script>
  <script>window.addEventListener('DOMContentLoaded', function () { TKSVatLookup.init(); });</script>
  <script src="/shared/shooting-star.js?v=20261019"></script>
</body>
</html>
